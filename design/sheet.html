<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Макеты UI «Библиотека»</title>
<style>
  html,body{margin:0;background:#2f2f2f;color:#eee;font-family:"Noto Sans","DejaVu Sans",sans-serif}
  h1{font-size:22px;font-weight:700;margin:18px 24px 6px}
  .sub{color:#aaa;font-size:14px;margin:0 24px 18px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:0 24px 28px}

<h1>«Библиотека» — макеты экранов</h1>
<p class="sub">ONYX BOOX RAPHAEL2 · 1264×1680 px · density 300 (1&nbsp;dp&nbsp;=&nbsp;1.875&nbsp;px) · e-ink, только ч/б</p>
<div class="grid">
<figure><img src="screens/01_main_authors.png" alt="S1 · Главный — вкладка «Авторы»"><figcaption><b>S1 · Главный — вкладка «Авторы»</b>Строка поиска, вкладки, список со счётчиками</figcaption></figure>
<figure><img src="screens/02_main_allbooks.png" alt="S1 · «Все книги» (обычная плотность)"><figcaption><b>S1 · «Все книги» (обычная плотность)</b>Обложка 56×84 dp, название/автор/серия</figcaption></figure>

<figure><img src="screens/04_main_date.png" alt="S1 · Вкладка «Дата»"><figcaption><b>S1 · Вкладка «Дата»</b>Обычные заголовки групп (без sticky)</figcaption></figure>
<figure><img src="screens/05_main_history.png" alt="S1 · Вкладка «История»"><figcaption><b>S1 · Вкладка «История»</b>Одна группа «Недавно открытые»</figcaption></figure>

<figure><img src="screens/08_main_banner_scan.png" alt="S1 · Баннер + идёт индексация (ST4/ST5)"><figcaption><b>S1 · Баннер + идёт индексация (ST4/ST5)</b>Недоступная книга приглушена</figcaption></figure>

<figure><img src="screens/18_dlg_clear_missing.png" alt="D4 · «Очистить отсутствующие»"><figcaption><b>D4 · «Очистить отсутствующие»</b>Удаляются книги и пустые группы</figcaption></figure>
