<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Макеты UI «InkShelf»</title>
<style>
  html,body{margin:0;background:#2f2f2f;color:#eee;font-family:"Noto Sans","DejaVu Sans",sans-serif}
  h1{font-size:24px;font-weight:700;margin:20px 26px 4px}
  .sub{color:#aaa;font-size:15px;margin:0 26px 20px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;padding:0 26px 30px}
  figure{margin:0;background:#3c3c3c;border:1px solid #555;border-radius:6px;overflow:hidden}
  figure img{display:block;width:100%;height:auto;background:#fff}
  figcaption{padding:8px 10px;font-size:12px;line-height:1.35;color:#ddd}
  figcaption b{display:block;color:#fff;font-size:13px}
</style></head>
<body>
<h1>__TITLE__</h1>
<p class="sub">__SUB__</p>
<div class="grid">
__FIGURES__
</div>
</body></html>
